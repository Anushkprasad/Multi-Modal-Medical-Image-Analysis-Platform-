version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_MOCK=true
      - DATABASE_URL=sqlite:///./local_test.db
      - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
